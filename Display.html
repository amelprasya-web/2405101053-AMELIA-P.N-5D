<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Layouting Display</title>
    <style>
        /* Menambahkan background warna krem/hijau muda lembut pada seluruh halaman */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: hwb(240 100% 0%); /* Warna background sesuai screenshot */
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Navigasi Link (Home, Profil, Contact) di Sebelah Kanan Atas */
        .nav-links {
            text-align: right;
            margin-bottom: 20px;
        }

        .nav-links a {
            color: blue;
            text-decoration: underline;
            margin-left: 10px;
            font-size: 14px;
        }

        /* Container Utama dengan Flexbox */
        .content-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Bagian Kiri (Judul & Copyright) */
        .left-section h1 {
            font-size: 24px;
            font-weight: bold;
            line-height: 1.2;
            margin: 0 0 15px 0;
            letter-spacing: 0.5px;
        }

        .left-section .copyright {
            font-size: 12px;
            color: #000;
            line-height: 1.3;
        }

        /* Bagian Kanan (Teks Isi & Gambar Poster) */
        .right-section {
            text-align: center;
        }

        .right-section p {
            font-size: 14px;
            margin: 0 0 10px 0;
        }

        .right-section img {
            width: 150px; /* Ukuran placeholder gambar */
            height: auto;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

                       <!-- Link Navigasi -->
        <div class="nav-links">
                <a href="#">HOME</a>
                <a href="#">PROFIL</a>
                <a href="#">CONTACT</a>
                
    </div>

    <!-- Area Konten Utama -->
    <div class="content-container">
        
        <!-- Sisi Kiri -->
        <div class="left-section">
            <h1>SELAMAT DATANG<br>DI WEBKU</h1>
            <div class="copyright">
                Copyright © 2021 Web Programming<br>
                UNIPMA
            </div>
        </div>

        <!-- Sisi Kanan -->
        <div class="right-section">
            <p>Bagian ini adalah isi Web</p>
            <!-- Ganti 'poster.jpg' dengan nama/path file gambar Anda -->
            <img src="poster.jpg" alt="Poster">
        </div>

    </div>

</body>
</html>
