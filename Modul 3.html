<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output Form Input Lengkap</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            margin: 20px;
            background-color: #ffffff;
            color: #000000;
        }

        .form-group {
            margin-bottom: 8px;
        }

        label.title {
            display: inline-block;
            width: 120px;
            vertical-align: top;
        }

        input[type="text"],
        input[type="password"],
        select,
        textarea {
            border: 1px solid #767676;
            padding: 2px 4px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            vertical-align: top;
        }

        input[type="submit"] {
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            padding: 2px 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <form onsubmit="event.preventDefault(); alert('Form berhasil diproses!');">
        <!-- Nama -->
        <div class="form-group">
            <label class="title" for="nama">Nama:</label>
            <input type="text" id="nama" name="nama" value="">
        </div>

        <!-- Password -->
        <div class="form-group">
            <label class="title" for="password">Password:</label>
            <input type="password" id="password" name="liacireng">
        </div>

        <!-- Jenis Kelamin -->
        <div class="form-group">
            <label class="title">Jenis Kelamin :</label>
            <input type="radio" id="laki" name="jenis_kelamin" value="Laki-Laki" checked>
            <label for="laki">Laki - Laki</label>
            
            <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
            <label for="perempuan">Perempuan</label>
        </div>

        <!-- Hobi -->
        <div class="form-group">
            <label class="title">Hobi:</label>
            <input type="checkbox" id="baca" name="hobi_baca" /> <label for="baca">Membaca Buku</label>
            <input type="checkbox" id="nulis" name="hobi_nulis" checked /> <label for="nulis">Menulis</label>
            <input type="checkbox" id="mancing" name="hobi_mancing" /> <label for="mancing">Memancing</label>
        </div>

        <!-- Asal Kota -->
        <div class="form-group">
            <label class="title" for="asal_kota">Asal Kota:</label>
            <select id="asal_kota" name="asal_kota">
                <option value="Kota Jakarta">Jakarta</option>
                <option value="Bandung">Bandung</option>
                <option value="Kota Semarang" selected>Semarang</option>
            </select>
        </div>

        <!-- Komentar Anda -->
        <div class="form-group">
            <label class="title" for="komentar">Komentar Anda:</label>
            <textarea id="komentar" name="komentar" rows="5" cols="22">Silahkan katakan isi hati anda</textarea>
        </div>

        <!-- Tombol Submit -->
        <div class="form-group" style="margin-top: 10px;">
            <input type="submit" value="Mulai Proses!">
        </div>
    </form>

</body>
</html>
