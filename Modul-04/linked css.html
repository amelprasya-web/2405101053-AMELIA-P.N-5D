<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Linked Styles</title>
    <style>
        p {
            background: #00b4d0;
            border-bottom: 4px solid #ea7e7e;
            padding-top: 15px;
            margin: 10px;
            display: block;
            width: auto;
            height: 35px;
            text-align: center;
        }

        #msg {
            color: lch(92.16% 44.93 115.19);
            font-weight: bold;
            font-size: 12px;
        }

        #error {
            color: hwb(13 5% 10%);
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Ini bagian header</h1>
    <p>Ini adalah paragraph</p>
    <p id="msg">Pesan informasi</p>
    <p id="error">Pesan kesalahan</p>
</body>
</html>
