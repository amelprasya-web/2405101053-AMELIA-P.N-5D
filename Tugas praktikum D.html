<!DOCTYPE html>
<html>
<head>
    <title>Evaluasi Form HTML</title>
</head>
<body>
    <h2>Halaman Evaluasi Form HTML</h2>
    
    <!-- Tag <form> -->
    <form action="proses_evaluasi.php" method="post">
        
        <!-- Tag <label> dan Input Text -->
        <label for="username">Input Text (Username):</label><br>
        <input type="text" id="username" name="username" placeholder=" " /><br><br>

        <!-- Tag <label> dan Input Password -->
        <label for="pwd">Input Password:</label><br>
        <input type="password" id="pwd" name=" " /><br><br>

        <!-- Input Radio -->
        <label>Input Radio (Status):</label><br>
        <input type="radio" name="status" value="Aktif" checked /> Aktif
        <input type="radio" name="status" value="Nonaktif" /> Nonaktif<br><br>

        <!-- Input Checkbox -->
        <label>Input Checkbox (Bahasa Pemrograman):</label><br>
        <input type="checkbox" name="lang_html" checked /> HTML
        <input type="checkbox" name="lang_php" /> PHP
        <input type="checkbox" name="lang_js" /> JavaScript<br><br>

        <!-- Tag <select> -->
        <label for="kota">Tag Select (Kota Asal):</label><br>
        <select id="kota" name="kota">
            <option value="Jakarta">Jakarta</option>
            <option value="Surabaya">Surabaya</option>
            <option value="Madiun" selected>Madiun</option>
        </select><br><br>

        <!-- Tag <textarea> -->
        <label for="pesan">Tag Textarea (Pesan):</label><br>
        <textarea id="pesan" name="pesan" rows="4" cols="30">Tulis pesan Anda di sini...</textarea><br><br>

        <!-- Input Submit -->
        <input type="submit" value="Input Submit (Kirim Data)" />

    </form>
</body>
</html>
